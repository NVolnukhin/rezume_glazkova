name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Токен нужен только на публикацию Pages — ничего больше воркфлоу не трогает.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: публикуется всегда последний коммит.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Проверка ресурсов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить, что все файлы на месте
        run: node scripts/check-assets.mjs

  deploy:
    name: Публикация
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Единственная правка перед публикацией: дата в sitemap должна
      # соответствовать реальному обновлению сайта, иначе поисковики
      # перестают ей доверять.
      - name: Проставить дату в sitemap
        run: |
          date=$(git log -1 --format=%cs)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${date}</lastmod>|" sitemap.xml
          grep lastmod sitemap.xml

      # Сайт статический: собирать нечего, публикуем репозиторий как есть.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
